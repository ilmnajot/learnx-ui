<!doctype html>
<html lang="uz" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <title>LearnX: IT mutaxassislari uchun ingliz tili mashqi</title>
    <meta name="description" content="Hujjatlarni oʻqiy olasiz. Endi yigʻilishda gapiring. Standup, code review va intervyu uchun kuniga 5 daqiqalik ingliz tili mashqi." />

    <!-- Link previews on Telegram, Facebook, LinkedIn and X. Set VITE_SITE_URL in .env.production before building. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="LearnX" />
    <meta property="og:title" content="LearnX: yigʻilishda inglizcha gapiring" />
    <meta property="og:description" content="IT mutaxassislari uchun kuniga 5 daqiqalik ingliz tili mashqi: AI bilan suhbat, qisqa videolar va jamoaviy oʻyinlar." />
    <meta property="og:url" content="%VITE_SITE_URL%/" />
    <meta property="og:image" content="%VITE_SITE_URL%/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="LearnX: IT mutaxassislari uchun ingliz tili mashqi" />
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      // Applies a saved dark theme before first paint, so it never flashes white.
      try {
        if (localStorage.getItem('learnx-theme') === 'dark') document.documentElement.dataset.theme = 'dark'
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
